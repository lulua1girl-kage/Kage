name: Build KAGE merged Nori APK v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Kage
        uses: actions/checkout@v5

      - name: Checkout Nori base
        uses: actions/checkout@v5
        with:
          repository: lulua1girl-kage/Nori-kage-
          path: .nori-base
          fetch-depth: 1

      - name: Validate and extract
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/merge_kage.py
          test -f .nori-base/nori-v36_5-build-script-fixed.zip
          mkdir -p .nori-v36
          unzip -q .nori-base/nori-v36_5-build-script-fixed.zip -d .nori-v36
          PROJECT_DIR="$(find .nori-v36 -type d -name v364-connect -print -quit)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" platform-tools "platforms;android-36" "build-tools;36.0.0"

      - name: Merge KAGE into Nori
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/merge_kage.py
          cd "$PROJECT_DIR"
          python3 -c 'from pathlib import Path; p=Path("package.json"); s=p.read_text(); s=s.replace("\\"@capacitor-community/speech-recognition\\": \\"8.0.0\\"","\\"@capacitor-community/speech-recognition\\": \\"7.0.1\\""); p.write_text(s)'
          python3 -c 'from pathlib import Path; p=Path("android/app/build.gradle"); s=p.read_text().replace("versionCode = 33","versionCode = 34").replace("versionName = \'33.0.0-rc1\'","versionName = \'34.0.0-kage-merged\'"); p.write_text(s)'
          node --check www/nori-jarvis-integration.js

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm install

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle --version

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"
          /tmp/gradle-8.13/bin/gradle clean assembleDebug --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/KAGE-Nori-merged-debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/KAGE-Nori-merged-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -P 4 -v 4 "$APK"
          "$AAPT2" dump badging "$APK" >/tmp/badging.txt
          unzip -t "$APK" >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kage-nori-merged-apk
          path: KAGE-Nori-merged-debug.apk
          if-no-files-found: error
