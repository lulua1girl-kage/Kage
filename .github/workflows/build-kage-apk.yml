name: Build KAGE merged Nori APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and verify KAGE APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Kage
        uses: actions/checkout@v5

      - name: Checkout proven Nori base
        uses: actions/checkout@v5
        with:
          repository: lulua1girl-kage/Nori-kage-
          path: .nori-base
          fetch-depth: 1

      - name: Validate workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/merge_kage.py
          test -f .nori-base/nori-v36_5-build-script-fixed.zip
          echo "KAGE workflow runner reached the build job successfully."
