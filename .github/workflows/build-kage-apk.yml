name: Build KAGE merged Nori APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify KAGE APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Kage
        uses: actions/checkout@v4

      - name: Checkout proven Nori base
        uses: actions/checkout@v4
        with:
          repository: lulua1girl-kage/Nori-kage-
          path: .nori-base
          fetch-depth: 1

      - name: Check inputs
        shell: bash
        run: |
          set -e
          test -f scripts/merge_kage.py
          test -f .nori-base/nori-v36_5-build-script-fixed.zip
          echo "Workflow job started successfully."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" platform-tools "platforms;android-36" "build-tools;36.0.0"

      - name: Merge without deleting existing features
        shell: bash
        run: |
          set -e
          python3 scripts/merge_kage.py
          cd "$PROJECT_DIR"
          python3 - <<'PY'
from pathlib import Path
p=Path("package.json")
s=p.read_text()
s=s.replace('"@capacitor-community/speech-recognition": "8.0.0"','"@capacitor-community/speech-recognition": "7.0.1"')
p.write_text(s)
app=Path("android/app/build.gradle")
s=app.read_text().replace("versionCode = 33","versionCode = 34").replace("versionName = '33.0.0-rc1'","versionName = '34.0.0-kage-merged'")
app.write_text(s)
PY
          node --check www/nori-jarvis-integration.js

      - name: Install web dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Sync Capacitor
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle --version

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          /tmp/gradle-8.13/bin/gradle clean assembleDebug --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/KAGE-Nori-merged-debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/KAGE-Nori-merged-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -P 4 -v 4 "$APK"
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt
          unzip -t "$APK" >/dev/null
          echo "APK verification passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kage-nori-merged-apk
          path: KAGE-Nori-merged-debug.apk
          if-no-files-found: error
