name: KAGE Nori APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KAGE Nori APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout KAGE
        uses: actions/checkout@v5

      - name: Checkout Nori source
        uses: actions/checkout@v5
        with:
          repository: lulua1girl-kage/Nori-kage-
          path: .nori-base
          fetch-depth: 1

      - name: Extract Nori project
        shell: bash
        run: |
          set -euo pipefail
          test -f .nori-base/nori-v36_5-build-script-fixed.zip
          mkdir -p .nori-v36
          unzip -q .nori-base/nori-v36_5-build-script-fixed.zip -d .nori-v36
          PROJECT_DIR="$(find .nori-v36 -type d -name v364-connect -print -quit)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Nori project: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare existing Nori app
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f package.json
          test -d android
          npm pkg set dependencies.@capacitor-community/speech-recognition=7.0.1
          npm install
          npx cap sync android

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd "$PROJECT_DIR/android"
          /tmp/gradle-8.13/bin/gradle clean assembleDebug --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/KAGE-Nori-merged-debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/KAGE-Nori-merged-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kage-nori-merged-apk
          path: KAGE-Nori-merged-debug.apk
          if-no-files-found: error
