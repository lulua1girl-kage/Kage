name: KAGE Nori APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KAGE Nori APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout KAGE
        uses: actions/checkout@v5

      - name: Checkout Nori source
        uses: actions/checkout@v5
        with:
          repository: lulua1girl-kage/Nori-kage-
          path: .nori-base
          fetch-depth: 1

      - name: Extract Nori project
        shell: bash
        run: |
          set -euo pipefail
          test -f .nori-base/nori-v36_5-build-script-fixed.zip
          mkdir -p .nori-v36
          unzip -q .nori-base/nori-v36_5-build-script-fixed.zip -d .nori-v36
          PROJECT_DIR="$(find .nori-v36 -type d -name v364-connect -print -quit)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Nori project: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare existing Nori app
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f package.json
          test -d android
          npm pkg set dependencies.@capacitor-community/speech-recognition=7.0.1
          npm install
          npx cap sync android

      - name: Repair V36.5 Android source compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          root=Path("android/app/src/main/java")
          def p(rel): return root/rel
          def replace(rel, old, new):
              f=p(rel); s=f.read_text()
              if old in s: f.write_text(s.replace(old,new,1))
          def add_import(rel, imp):
              f=p(rel); s=f.read_text()
              if imp not in s:
                  lines=s.splitlines(True)
                  i=0
                  while i<len(lines) and (lines[i].startswith("package ") or lines[i].strip()=="" or lines[i].startswith("import ")): i+=1
                  # Put after package line and existing imports.
                  pos=1
                  while pos<len(lines) and (lines[pos].startswith("import ") or lines[pos].strip()==""): pos+=1
                  lines.insert(pos, imp+"\n")
                  f.write_text("".join(lines))
          add_import("com/nori/jarvis/NoriKnowledgePlugin.java","import com.nori.jarvis.nori.identity.NoriSessionAuthority;")
          add_import("com/nori/jarvis/NoriKnowledgePlugin.java","import com.getcapacitor.ActivityResult;")
          add_import("com/nori/jarvis/visual/NoriVisualPlugin.java","import com.getcapacitor.ActivityResult;")
          add_import("com/nori/jarvis/visual/NoriExamIntegrityPlugin.java","import com.getcapacitor.ActivityResult;")
          replace("com/nori/jarvis/NoriBiometricPlugin.java","import android.app.BiometricPrompt;","import android.hardware.biometrics.BiometricPrompt;")
          replace("com/nori/jarvis/nori/NoriNativeCore.java","import com.nori.jarvis.nori.data.DataRepository;","import com.nori.jarvis.nori.data.DataRepository;"+chr(10)+"import com.nori.jarvis.nori.brain.NoriBrain;")
          replace("com/nori/jarvis/nori/NoriNativeCore.java","private final brain.NoriBrain brain;","private final NoriBrain brain;")
          replace("com/nori/jarvis/nori/NoriNativeCore.java","this.brain = new brain.NoriBrain(repository);","this.brain = new NoriBrain(repository);")
          replace("com/nori/jarvis/nori/NoriNativeCore.java","public brain.NoriBrain getBrain() {","public NoriBrain getBrain() {")
          add_import("com/nori/jarvis/NoriMetaBrainPlugin.java","import com.nori.jarvis.nori.meta.NoriMetaBrainOrchestrator;")
          add_import("com/nori/jarvis/nori/data/NoriDatabase.java","import android.database.Cursor;")
          db_file = p("com/nori/jarvis/nori/data/NoriDatabase.java")
          db_text = db_file.read_text()
          if "rawQuery(String sql, String[] args)" not in db_text:
              db_text = db_text.rsplit("}", 1)[0] + chr(10) + "    public Cursor rawQuery(String sql, String[] args) { return getReadableDatabase().rawQuery(sql, args); }" + chr(10) + "}" + chr(10)
              db_file.write_text(db_text)
          replace("com/nori/jarvis/nori/ui/NoriTheme.java","public static TextView metric(Context c, String value, String label) {","public static LinearLayout metric(Context c, String value, String label) {")
          replace("com/nori/jarvis/nori/presence/NoriInteractiveCircleView.java","c.drawText(state.name,cx,cy+r*2.65f,p);","c.drawText(state.name(),cx,cy+r*2.65f,p);")
          print("Compatibility repairs applied.")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd "$PROJECT_DIR/android"
          /tmp/gradle-8.13/bin/gradle clean assembleDebug --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/KAGE-Nori-merged-debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/KAGE-Nori-merged-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kage-nori-merged-apk
          path: KAGE-Nori-merged-debug.apk
          if-no-files-found: error
